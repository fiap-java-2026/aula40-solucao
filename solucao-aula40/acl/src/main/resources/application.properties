# Aula 40 — API nova protegida por Anti-Corruption Layer
quarkus.application.name=acl
quarkus.http.port=4000
# os @QuarkusTest sobem a app na porta de teste (padrão de portas da aula: 40xx)
quarkus.http.test-port=4003
quarkus.analytics.disabled=true

# slide 16: REST Client apontando para o legado, com timeouts explícitos (ms)
quarkus.rest-client.legado.url=http://localhost:4001
quarkus.rest-client.legado.connect-timeout=1000
quarkus.rest-client.legado.read-timeout=2000

# slide 25: documentação do contrato
quarkus.smallrye-openapi.info-title=API de Clientes (ACL sobre o legado)
quarkus.smallrye-openapi.info-version=1.0
quarkus.swagger-ui.always-include=true

quarkus.log.category."br.com.fiap.acl".level=INFO
